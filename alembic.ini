# Alembic CLI settings. The database comes from DATABASE_URL (.env).
#   alembic upgrade head                              apply migrations
#   alembic revision --autogenerate -m "what changed" new migration from spr/models.py
# The bot itself runs "upgrade head" at startup and does not read this file.
[alembic]
script_location = %(here)s/spr/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
