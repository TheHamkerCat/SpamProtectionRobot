services:
  bot:
    container_name: spr
    build: .
    restart: always
    stop_grace_period: 1m
    env_file: .env
    environment:
      DATABASE_URL: postgresql://spr:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/spr
    volumes:
      - session:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18.6-alpine3.24@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    restart: always
    environment:
      POSTGRES_USER: spr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: spr
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql/<version>
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spr -d spr"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres:
  session:
